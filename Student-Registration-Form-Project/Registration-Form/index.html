<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <form id="registrationForm" class="form-card" novalidate>
        <div class="form-heading">
          <h1>Student Registration</h1>
          <p>Please fill in your details to create an account.</p>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
            />
            <small class="error" id="fullNameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              autocomplete="email"
            />
            <small class="error" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="10-digit phone number"
              maxlength="10"
              autocomplete="tel"
            />
            <small class="error" id="phoneError"></small>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" />
            <small class="error" id="dobError"></small>
          </div>

          <fieldset class="form-group full-width">
            <legend>Gender</legend>
            <div class="radio-row">
              <label
                ><input type="radio" name="gender" value="Male" /> Male</label
              >
              <label
                ><input type="radio" name="gender" value="Female" />
                Female</label
              >
              <label
                ><input type="radio" name="gender" value="Other" /> Other</label
              >
            </div>
            <small class="error" id="genderError"></small>
          </fieldset>

          <div class="form-group full-width">
            <label for="course">Select Course</label>
            <select id="course" name="course">
              <option value="">-- Choose a course --</option>
              <option value="HTML & CSS">HTML &amp; CSS</option>
              <option value="JavaScript">JavaScript</option>
              <option value="Java">Java</option>
              <option value="Python">Python</option>
              <option value="Full Stack Development">
                Full Stack Development
              </option>
            </select>
            <small class="error" id="courseError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
            />
            <small class="error" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter password"
              autocomplete="new-password"
            />
            <small class="error" id="confirmPasswordError"></small>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" />
          <span>I agree to the terms and conditions.</span>
        </label>
        <small class="error" id="termsError"></small>

        <div class="button-row">
          <button type="submit" class="submit-btn">Register Now</button>
          <button type="reset" class="reset-btn">Clear Form</button>
        </div>

        <p
          id="successMessage"
          class="success-message"
          role="status"
          aria-live="polite"
        ></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
